name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Altere para 'master' se sua branch principal tiver esse nome

# Permissões necessárias para o GitHub Actions implantar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o projeto (Build)
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Copiar index.html para 404.html (rotas do SPA)
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato da pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta gerada pelo Vite

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
