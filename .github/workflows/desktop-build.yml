name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências do editor
        run: npm ci

      - name: Gerar o editor web
        run: npm run build

      - name: Instalar dependências do aplicativo
        working-directory: desktop
        run: npm install

      - name: Gerar instaladores
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: siteforge-desktop-${{ matrix.os }}
          path: desktop/release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar os instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "SiteForge ${TAG#desktop-}" --generate-notes
          fi
